name: Build & Package Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Fetch Sherpa-ONNX Prebuilt AAR Dynamically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/libs
          python3 -c "
          import urllib.request, json, os, sys

          dest = 'app/libs/sherpa-onnx.aar'
          token = os.environ.get('GH_TOKEN', '')
          headers = {'User-Agent': 'Mozilla/5.0'}
          if token:
              headers['Authorization'] = f'Bearer {token}'

          download_url = None
          endpoints = [
              'https://api.github.com/repos/k2-fsa/sherpa-onnx/releases/tags/v1.13.5',
              'https://api.github.com/repos/k2-fsa/sherpa-onnx/releases/tags/v2.0.1',
              'https://api.github.com/repos/k2-fsa/sherpa-onnx/releases/latest',
              'https://api.github.com/repos/k2-fsa/sherpa-onnx/releases?per_page=10'
          ]

          for ep in endpoints:
              try:
                  req = urllib.request.Request(ep, headers=headers)
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      raw = json.loads(resp.read().decode())
                      items = raw if isinstance(raw, list) else [raw]
                      for release in items:
                          for asset in release.get('assets', []):
                              name = asset.get('name', '')
                              if name.endswith('.aar') and 'rknn' not in name:
                                  download_url = asset.get('browser_download_url')
                                  print(f'Discovered release AAR: {name} in {release.get(\"tag_name\")}')
                                  break
                          if download_url:
                              break
              except Exception as e:
                  print(f'Endpoint {ep} warning: {e}')
              if download_url:
                  break

          if not download_url:
              print('Falling back to direct release download URL...')
              download_url = 'https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.5/sherpa-onnx-1.13.5.aar'

          print(f'Downloading AAR from {download_url}...')
          req = urllib.request.Request(download_url, headers=headers)
          with urllib.request.urlopen(req, timeout=60) as resp, open(dest, 'wb') as f:
              f.write(resp.read())

          size = os.path.getsize(dest)
          print(f'Successfully downloaded {dest}: {size} bytes ({size / (1024*1024):.1f} MB)')
          if size < 1000000:
              print(f'ERROR: Downloaded file is too small ({size} bytes), likely a 404/rate-limit response')
              sys.exit(1)
          "
          ls -lh app/libs/

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameLens-Translator-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
